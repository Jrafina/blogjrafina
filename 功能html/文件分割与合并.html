<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://raw.githubusercontent.com/Jrafina/picbed/main/favicon.ico" type="image/x-icon">
    <title>ZIP文件分割合并工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <!-- 配置Tailwind自定义主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // 靛蓝色主色调
                        secondary: '#10B981', // 绿色辅助色
                        danger: '#EF4444',    // 红色警示色
                        neutral: '#64748B',   // 中性色
                        light: '#F8FAFC',     // 浅色背景
                        dark: '#1E293B',      // 深色文字
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 4px 20px rgba(0, 0, 0, 0.05)',
                        'card-hover': '0 8px 30px rgba(0, 0, 0, 0.1)',
                        'input': '0 0 0 2px rgba(79, 70, 229, 0.2)',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .tab-active {
                @apply border-b-2 border-primary text-primary font-medium relative;
            }
            .tab-active::after {
                @apply content-[''] absolute bottom-0 left-0 w-full h-0.5 bg-primary rounded-full;
            }
            .progress-bar {
                @apply h-2.5 bg-gray-100 rounded-full overflow-hidden shadow-inner;
            }
            .progress-value {
                @apply h-full bg-gradient-to-r from-primary to-indigo-400 transition-all duration-500 ease-out rounded-full;
            }
            .btn-primary {
                @apply bg-gradient-to-r from-primary to-indigo-500 text-white px-6 py-2.5 rounded-lg hover:from-indigo-600 hover:to-indigo-700 transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-primary/50;
            }
            .btn-secondary {
                @apply bg-gradient-to-r from-secondary to-emerald-500 text-white px-6 py-2.5 rounded-lg hover:from-emerald-600 hover:to-emerald-700 transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-secondary/50;
            }
            .btn-outline {
                @apply border border-gray-300 bg-white text-gray-700 px-6 py-2.5 rounded-lg hover:bg-gray-50 transition-all duration-300 shadow-sm hover:shadow transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-gray-200;
            }
            .input-field {
                @apply w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-300 bg-white shadow-sm hover:shadow;
            }
            .card {
                @apply bg-white rounded-xl shadow-card hover:shadow-card-hover transition-all duration-300 overflow-hidden;
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-indigo-400;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-light to-gray-100 font-inter text-dark min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- 头部装饰 + 标题 -->
        <header class="mb-10 text-center relative">
            <div class="absolute top-1/2 left-0 w-full h-16 bg-gradient-to-r from-primary/5 to-indigo-400/5 -translate-y-1/2 rounded-full blur-2xl -z-10"></div>
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold mb-3 text-gradient">
                <i class="fa fa-file-archive-o mr-3"></i>ZIP文件分割合并工具
            </h1>
            <p class="text-neutral text-lg max-w-2xl mx-auto">
                轻松分割大ZIP文件或合并分割后的文件，全程本地处理，安全高效
            </p>
            <!-- 浏览器提示 -->
            <div class="mt-4 text-sm text-amber-600">
                <i class="fa fa-info-circle mr-1"></i>
                文件夹选择功能仅支持 Chrome/Edge/Safari 浏览器，Firefox需升级至最新版
            </div>
        </header>

        <!-- 标签页导航 -->
        <div class="bg-white rounded-xl shadow-card p-1 mb-8">
            <div class="flex space-x-1 md:space-x-4">
                <button id="split-tab-btn" class="tab-active py-4 px-6 w-full md:w-auto focus:outline-none transition-all duration-300" onclick="showTab('split-tab')">
                    <i class="fa fa-scissors mr-2"></i>分割文件
                </button>
                <button id="merge-tab-btn" class="py-4 px-6 w-full md:w-auto text-gray-500 hover:text-gray-700 focus:outline-none transition-all duration-300" onclick="showTab('merge-tab')">
                    <i class="fa fa-compress mr-2"></i>合并文件
                </button>
            </div>
        </div>

        <!-- 分割文件标签页 -->
        <div id="split-tab" class="tab-content">
            <div class="card p-8 mb-8">
                <!-- 选择文件 -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-3">选择要分割的ZIP文件</label>
                    <div class="flex flex-col sm:flex-row">
                        <input type="text" id="split-file-path" class="input-field rounded-r-none sm:rounded-r-none rounded-b-lg sm:rounded-b-none mb-2 sm:mb-0" readonly placeholder="未选择文件">
                        <label for="split-file-input" class="btn-primary w-full sm:w-auto rounded-t-lg sm:rounded-t-none rounded-l-lg sm:rounded-l-none">
                            <i class="fa fa-folder-open mr-1"></i>浏览文件
                        </label>
                        <input type="file" id="split-file-input" accept=".zip" class="hidden" onchange="updateSplitFilePath(this)">
                    </div>
                </div>

                <!-- 分割设置 -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-4">分割设置</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm text-gray-600 mb-2">每个文件大小</label>
                            <div class="flex">
                                <input type="number" id="split-size" min="1" max="10240" value="95" class="input-field rounded-r-none border-r-0">
                                <select id="split-unit" class="input-field rounded-l-none border-l-0 bg-gray-50">
                                    <option value="MB">MB</option>
                                    <option value="GB">GB</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-2">输出文件名前缀</label>
                            <input type="text" id="split-output-prefix" class="input-field" placeholder="默认使用原文件名">
                        </div>
                    </div>
                </div>

                <!-- 进度条 -->
                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="font-medium">处理进度</span>
                        <span id="split-progress-text" class="text-primary font-medium">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="split-progress-bar" class="progress-value" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 按钮 -->
                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                    <button id="start-split-btn" class="btn-secondary flex-1" onclick="startSplit()">
                        <i class="fa fa-play mr-2"></i>开始分割
                    </button>
                    <button id="cancel-split-btn" class="btn-outline flex-1" onclick="cancelSplit()" disabled>
                        <i class="fa fa-stop mr-2"></i>取消操作
                    </button>
                </div>
            </div>

            <!-- 状态信息 -->
            <div class="card p-6">
                <div class="text-center mb-3">
                    <div id="split-status" class="text-neutral text-lg mb-2">请选择文件和设置参数</div>
                    <div id="split-time" class="text-secondary font-medium"></div>
                    <!-- 分割文件下载按钮容器 -->
                    <div id="split-download-container" class="mt-4"></div>
                </div>
                <div class="flex justify-center mt-4">
                    <div class="text-xs text-gray-400">
                        <i class="fa fa-info-circle mr-1"></i>所有操作均在本地完成，文件不会上传到服务器
                    </div>
                </div>
            </div>
        </div>

        <!-- 合并文件标签页 -->
        <div id="merge-tab" class="tab-content hidden">
            <div class="card p-8 mb-8">
                <!-- 文件夹选择 -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-4">选择包含分割文件的文件夹</label>
                    
                    <div class="flex flex-wrap gap-3 mb-4">
                        <!-- 修复：按钮直接触发点击，避免label嵌套问题 -->
                        <button class="btn-primary" onclick="document.getElementById('merge-folder-input').click()">
                            <i class="fa fa-folder-open mr-2"></i>选择文件夹
                        </button>
                        <button class="btn-outline" onclick="clearMergeFiles()">
                            <i class="fa fa-eraser mr-2"></i>清空列表
                        </button>
                    </div>
                    
                    <!-- 修复：同时添加directory和webkitdirectory，兼容更多浏览器 -->
                    <input 
                        type="file" 
                        id="merge-folder-input" 
                        class="hidden"
                        webkitdirectory 
                        directory 
                        multiple 
                        onchange="scanFolderFiles(this)"
                        accept=".zip"  <!-- 过滤非zip文件 -->
                    >
                    
                    <!-- 文件夹路径显示 -->
                    <div class="mb-4">
                        <input type="text" id="merge-folder-path" class="input-field bg-gray-50" readonly placeholder="未选择文件夹">
                    </div>
                    
                    <!-- 筛选后的文件列表 -->
                    <div class="border border-gray-100 rounded-xl bg-gray-50 max-h-64 overflow-y-auto mb-3">
                        <ul id="merge-files-list" class="divide-y divide-gray-100">
                            <!-- 文件列表将通过JS动态添加 -->
                        </ul>
                    </div>
                    
                    <!-- 验证提示 -->
                    <div id="merge-validation" class="mt-2 text-sm"></div>
                </div>

                <!-- 输出设置 -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-3">输出设置</label>
                    <input type="text" id="merge-output-name" class="input-field" placeholder="合并后的文件名（默认使用原始文件名）">
                </div>

                <!-- 进度条 -->
                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="font-medium">处理进度</span>
                        <span id="merge-progress-text" class="text-primary font-medium">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="merge-progress-bar" class="progress-value" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 按钮 -->
                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                    <button id="start-merge-btn" class="btn-secondary flex-1" onclick="startMerge()" disabled>
                        <i class="fa fa-play mr-2"></i>开始合并
                    </button>
                    <button id="cancel-merge-btn" class="btn-outline flex-1" onclick="cancelMerge()" disabled>
                        <i class="fa fa-stop mr-2"></i>取消操作
                    </button>
                </div>
            </div>

            <!-- 状态信息 -->
            <div class="card p-6">
                <div class="text-center mb-3">
                    <div id="merge-status" class="text-neutral text-lg mb-2">请选择包含分割文件的文件夹</div>
                    <div id="merge-time" class="text-secondary font-medium"></div>
                    <!-- 合并文件下载按钮容器 -->
                    <div id="merge-download-container" class="mt-4"></div>
                </div>
                <div class="flex justify-center mt-4">
                    <div class="text-xs text-gray-400">
                        <i class="fa fa-info-circle mr-1"></i>所有操作均在本地完成，文件不会上传到服务器
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="mt-16 text-center">
            <div class="inline-block p-4 rounded-xl bg-white shadow-sm mb-4">
                <div class="text-neutral text-sm">
                    <p class="mb-1">ZIP文件分割合并工具 &copy; 2025</p>
                    <p class="text-xs text-gray-400">基于 JSZip 开发 | 本地处理更安全</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // 全局变量
        let splitWorker = null;
        let mergeWorker = null;
        let isSplitCancelled = false;
        let isMergeCancelled = false;
        let validSplitFiles = []; // 存储验证后的分割文件
        let originalFileName = ''; // 原始文件名
        let lastSplitFiles = []; // 保存最后分割的文件信息
        let lastMergedFile = null; // 保存最后合并的文件

        // 显示指定标签页
        function showTab(tabId) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // 移除所有标签按钮的活跃状态
            document.querySelectorAll('#split-tab-btn, #merge-tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
                btn.classList.remove('text-primary', 'font-medium', 'border-b-2', 'border-primary');
            });
            
            // 显示选中的标签页
            document.getElementById(tabId).classList.remove('hidden');
            
            // 设置标签按钮的活跃状态
            const btnId = tabId.replace('tab', 'tab-btn');
            document.getElementById(btnId).classList.add('tab-active');
            document.getElementById(btnId).classList.remove('text-gray-500');
        }

        // 更新分割文件路径显示
        function updateSplitFilePath(input) {
            if (input.files && input.files[0]) {
                document.getElementById('split-file-path').value = input.files[0].name;
                
                // 自动填充输出前缀
                const fileName = input.files[0].name.replace(/\.zip$/i, '');
                document.getElementById('split-output-prefix').value = fileName;
                
                // 重置状态
                document.getElementById('split-status').textContent = '准备就绪';
                document.getElementById('split-time').textContent = '';
                document.getElementById('split-progress-bar').style.width = '0%';
                document.getElementById('split-progress-text').textContent = '0%';
                // 清空下载按钮
                document.getElementById('split-download-container').innerHTML = '';
            }
        }

        // 扫描文件夹中的分割文件（修复核心逻辑）
        async function scanFolderFiles(input) {
            if (!input.files || input.files.length === 0) {
                document.getElementById('merge-validation').innerHTML = '<span class="text-danger"><i class="fa fa-exclamation-circle mr-1"></i>未选择任何文件/文件夹</span>';
                return;
            }
            
            // 清空之前的列表和数据
            clearMergeFiles();
            
            // 修复：兼容不同浏览器的路径解析
            let folderPath = '未知文件夹';
            if (input.files[0].webkitRelativePath) {
                folderPath = input.files[0].webkitRelativePath.split('/')[0] || '选择的文件夹';
            } else if (input.files[0].path) { // 非标准属性，部分浏览器支持
                folderPath = input.files[0].path.split('/').slice(0, -1).join('/') || '选择的文件夹';
            }
            document.getElementById('merge-folder-path').value = folderPath;
            
            // 修复：放宽文件筛选条件，先显示所有zip文件，再验证格式
            const splitFiles = Array.from(input.files).filter(file => {
                return file.name.endsWith('.zip');
            });
            
            // 修改：更新正则表达式以匹配新的文件名格式（原名partX.zip）
            const partFiles = splitFiles.filter(file => /part\d+\.zip$/i.test(file.name));
            
            if (splitFiles.length === 0) {
                document.getElementById('merge-validation').innerHTML = '<span class="text-danger"><i class="fa fa-exclamation-circle mr-1"></i>未找到ZIP文件</span>';
                document.getElementById('merge-status').textContent = '未找到可合并的ZIP文件';
                return;
            }
            
            if (partFiles.length === 0) {
                document.getElementById('merge-validation').innerHTML = '<span class="text-amber-500"><i class="fa fa-warning mr-1"></i>未找到分割后的文件（*partX.zip），仅找到普通ZIP文件</span>';
                document.getElementById('merge-status').textContent = '未找到分割后的文件';
                // 显示找到的普通zip文件
                const fileList = document.getElementById('merge-files-list');
                splitFiles.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'p-4 hover:bg-gray-50 transition-colors';
                    li.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <i class="fa fa-file-zip-o text-primary mr-3 text-lg"></i>
                                <div>
                                    <span class="font-medium">${file.name}</span>
                                    <span class="ml-2 text-xs text-gray-500">(非分割文件)</span>
                                </div>
                            </div>
                            <span class="text-xs text-gray-500">${formatFileSize(file.size)}</span>
                        </div>
                    `;
                    fileList.appendChild(li);
                });
                return;
            }
            
            // 解析每个文件的元数据，验证是否属于同一组
            const fileMetadata = [];
            const validationEl = document.getElementById('merge-validation');
            
            try {
                validationEl.innerHTML = '<span class="text-primary"><i class="fa fa-spinner fa-spin mr-1"></i>正在验证文件...</span>';
                
                // 读取每个文件的元数据（增加错误捕获）
                for (const file of partFiles) {
                    try {
                        const meta = await readFileChunkMetadata(file);
                        fileMetadata.push({
                            file,
                            meta,
                            index: meta.chunkIndex
                        });
                    } catch (e) {
                        console.warn(`文件${file.name}验证失败:`, e);
                        continue; // 跳过无效文件
                    }
                }
                
                if (fileMetadata.length === 0) {
                    validationEl.innerHTML = '<span class="text-danger"><i class="fa fa-exclamation-circle mr-1"></i>没有有效的分割文件（元数据验证失败）</span>';
                    document.getElementById('merge-status').textContent = '文件验证失败：无有效分割文件';
                    return;
                }
                
                // 验证所有文件是否属于同一组
                const firstMeta = fileMetadata[0].meta;
                const allSameGroup = fileMetadata.every(item => 
                    item.meta.originalName === firstMeta.originalName && 
                    item.meta.totalChunks === firstMeta.totalChunks
                );
                
                if (!allSameGroup) {
                    validationEl.innerHTML = '<span class="text-danger"><i class="fa fa-exclamation-circle mr-1"></i>文件夹中包含不同组的分割文件</span>';
                    document.getElementById('merge-status').textContent = '文件验证失败：包含不同组的分割文件';
                    return;
                }
                
                // 按chunkIndex排序
                fileMetadata.sort((a, b) => a.index - b.index);
                
                // 检查是否有缺失的块
                const totalChunks = firstMeta.totalChunks;
                const foundIndexes = fileMetadata.map(item => item.index);
                const missingIndexes = [];
                
                for (let i = 0; i < totalChunks; i++) {
                    if (!foundIndexes.includes(i)) {
                        missingIndexes.push(i + 1);
                    }
                }
                
                // 更新验证信息
                if (missingIndexes.length > 0) {
                    validationEl.innerHTML = `<span class="text-amber-500"><i class="fa fa-warning mr-1"></i>发现缺失的文件块：${missingIndexes.join(', ')}（共${totalChunks}块）</span>`;
                    document.getElementById('start-merge-btn').disabled = true;
                    document.getElementById('merge-status').textContent = `找到${fileMetadata.length}/${totalChunks}个文件块，无法合并`;
                } else {
                    validationEl.innerHTML = `<span class="text-secondary"><i class="fa fa-check-circle mr-1"></i>验证成功：找到${totalChunks}个完整文件块</span>`;
                    document.getElementById('start-merge-btn').disabled = false;
                    document.getElementById('merge-status').textContent = `已找到${totalChunks}个完整文件块，准备合并`;
                    
                    // 自动填充输出文件名
                    originalFileName = firstMeta.originalName.replace(/\.zip$/i, '');
                    document.getElementById('merge-output-name').value = originalFileName;
                }
                
                // 保存验证后的文件列表
                validSplitFiles = fileMetadata.map(item => item.file);
                
                // 显示文件列表
                const fileList = document.getElementById('merge-files-list');
                fileMetadata.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = 'p-4 hover:bg-gray-50 transition-colors';
                    li.dataset.name = item.file.name;
                    li.dataset.size = item.file.size;
                    li.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <i class="fa fa-file-zip-o text-primary mr-3 text-lg"></i>
                                <div>
                                    <span class="font-medium">${item.file.name}</span>
                                    <span class="ml-2 text-xs text-gray-500">(第${item.index + 1}/${totalChunks}块)</span>
                                </div>
                            </div>
                            <span class="text-xs text-gray-500">${formatFileSize(item.file.size)}</span>
                        </div>
                    `;
                    fileList.appendChild(li);
                });
                
            } catch (error) {
                validationEl.innerHTML = `<span class="text-danger"><i class="fa fa-exclamation-circle mr-1"></i>验证失败：${error.message}</span>`;
                document.getElementById('merge-status').textContent = `文件验证失败：${error.message}`;
                console.error('扫描文件夹失败:', error);
            }
        }

        // 清空合并文件列表
        function clearMergeFiles() {
            document.getElementById('merge-files-list').innerHTML = '';
            document.getElementById('merge-folder-path').value = '';
            document.getElementById('merge-validation').textContent = '';
            document.getElementById('merge-status').textContent = '请选择包含分割文件的文件夹';
            document.getElementById('merge-time').textContent = '';
            document.getElementById('merge-progress-bar').style.width = '0%';
            document.getElementById('merge-progress-text').textContent = '0%';
            document.getElementById('start-merge-btn').disabled = true;
            document.getElementById('merge-download-container').innerHTML = '';
            validSplitFiles = [];
            originalFileName = '';
            document.getElementById('merge-output-name').value = '';
        }

        // 开始分割文件
        function startSplit() {
            const fileInput = document.getElementById('split-file-input');
            const splitSize = parseInt(document.getElementById('split-size').value);
            const splitUnit = document.getElementById('split-unit').value;
            let outputPrefix = document.getElementById('split-output-prefix').value || 'split';
            
            // 验证输入
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('请选择要分割的ZIP文件');
                return;
            }
            
            if (isNaN(splitSize) || splitSize <= 0) {
                alert('请输入有效的分割大小');
                return;
            }
            
            // 转换为字节
            const chunkSize = splitUnit === 'MB' ? splitSize * 1024 * 1024 : splitSize * 1024 * 1024 * 1024;
            const file = fileInput.files[0];
            
            // 检查分割大小是否大于文件大小
            if (chunkSize >= file.size) {
                alert('分割大小大于等于文件大小，无需分割');
                return;
            }
            
            // 更新UI状态
            document.getElementById('start-split-btn').disabled = true;
            document.getElementById('cancel-split-btn').disabled = false;
            document.getElementById('split-status').textContent = '正在分割文件...';
            document.getElementById('split-time').textContent = '';
            document.getElementById('split-progress-bar').style.width = '0%';
            document.getElementById('split-progress-text').textContent = '0%';
            document.getElementById('split-download-container').innerHTML = '';
            
            isSplitCancelled = false;
            lastSplitFiles = []; // 清空上次的分割文件记录
            
            // 开始分割（使用Web Worker避免UI阻塞）
            splitWorker = new Worker(URL.createObjectURL(new Blob([`
                self.onmessage = function(e) {
                    const { file, chunkSize, outputPrefix } = e.data;
                    const totalChunks = Math.ceil(file.size / chunkSize);
                    let currentChunk = 0;
                    
                    // 创建文件读取器
                    const reader = new FileReader();
                    
                    // 递归处理每个块
                    function processChunk() {
                        if (currentChunk >= totalChunks || e.data.isCancelled) {
                            self.postMessage({ type: 'done', totalChunks });
                            return;
                        }
                        
                        const start = currentChunk * chunkSize;
                        const end = Math.min(start + chunkSize, file.size);
                        const chunk = file.slice(start, end);
                        
                        reader.onload = function(event) {
                            if (e.data.isCancelled) {
                                self.postMessage({ type: 'done', cancelled: true });
                                return;
                            }
                            
                            // 发送块数据
                            self.postMessage({
                                type: 'chunk',
                                data: event.target.result,
                                index: currentChunk,
                                totalChunks,
                                fileName: file.name
                            });
                            
                            currentChunk++;
                            const progress = Math.round((currentChunk / totalChunks) * 100);
                            self.postMessage({ type: 'progress', value: progress });
                            
                            // 处理下一个块
                            processChunk();
                        };
                        
                        reader.readAsArrayBuffer(chunk);
                    }
                    
                    // 开始处理第一个块
                    processChunk();
                };
            `], { type: 'application/javascript' })));
            
            // 记录开始时间
            const startTime = new Date().getTime();
            
            // 处理Worker消息
            splitWorker.onmessage = function(e) {
                switch (e.data.type) {
                    case 'progress':
                        document.getElementById('split-progress-bar').style.width = `${e.data.value}%`;
                        document.getElementById('split-progress-text').textContent = `${e.data.value}%`;
                        break;
                        
                    case 'chunk':
                        if (isSplitCancelled) return;
                        
                        // 创建包含元数据的新文件
                        const meta = JSON.stringify({
                            originalName: e.data.fileName,
                            totalChunks: e.data.totalChunks,
                            chunkIndex: e.data.index
                        });
                        
                        const metaBytes = new TextEncoder().encode(meta);
                        const metaLength = new Uint32Array([metaBytes.length]);
                        
                        // 创建包含元数据和实际数据的新ArrayBuffer
                        const combined = new Uint8Array(metaLength.byteLength + metaBytes.length + e.data.data.byteLength);
                        combined.set(new Uint8Array(metaLength.buffer), 0);
                        combined.set(metaBytes, metaLength.byteLength);
                        combined.set(new Uint8Array(e.data.data), metaLength.byteLength + metaBytes.length);
                        
                        // 保存分块文件 - 修改：使用新的命名格式（原名partX.zip）
                        const blob = new Blob([combined], { type: 'application/zip' });
                        const partNumber = e.data.index + 1;
                        
                        // 确保前缀以.zip结尾则去掉.zip
                        let processedPrefix = outputPrefix;
                        if (processedPrefix.toLowerCase().endsWith('.zip')) {
                            processedPrefix = processedPrefix.slice(0, -4);
                        }
                        
                        // 新文件名格式：前缀 + part + 数字 + .zip
                        const fileName = `${processedPrefix}part${partNumber}.zip`;
                        
                        // 保存文件信息，用于稍后下载
                        lastSplitFiles.push({
                            blob: blob,
                            fileName: fileName
                        });
                        
                        // 自动下载
                        saveAs(blob, fileName);
                        
                        // 实时更新状态
                        if (e.data.index === 0) {
                            document.getElementById('split-status').textContent = `正在下载第1个分割文件...`;
                        } else if (e.data.index === e.data.totalChunks - 1) {
                            document.getElementById('split-status').textContent = `正在下载最后一个分割文件...`;
                        }
                        break;
                        
                    case 'done':
                        const endTime = new Date().getTime();
                        const elapsedTime = (endTime - startTime) / 1000;
                        
                        document.getElementById('split-progress-bar').style.width = '100%';
                        document.getElementById('split-progress-text').textContent = '100%';
                        
                        if (e.data.cancelled || isSplitCancelled) {
                            document.getElementById('split-status').textContent = '分割已取消';
                        } else {
                            document.getElementById('split-status').textContent = `文件分割完成，共生成 ${e.data.totalChunks} 个部分`;
                            document.getElementById('split-time').textContent = formatTime(elapsedTime);
                            
                            // 显示重新下载所有分割文件的按钮
                            if (lastSplitFiles.length > 0) {
                                const downloadContainer = document.getElementById('split-download-container');
                                downloadContainer.innerHTML = `
                                    <button onclick="downloadAllSplitFiles()" class="btn-primary">
                                        <i class="fa fa-download mr-2"></i>重新下载所有分割文件
                                    </button>
                                `;
                            }
                        }
                        
                        // 重置按钮状态
                        document.getElementById('start-split-btn').disabled = false;
                        document.getElementById('cancel-split-btn').disabled = true;
                        splitWorker = null;
                        break;
                }
            };
            
            // 发送数据到Worker
            splitWorker.postMessage({
                file: file,
                chunkSize: chunkSize,
                outputPrefix: outputPrefix,
                isCancelled: false
            });
        }

        // 下载所有分割文件
        function downloadAllSplitFiles() {
            if (lastSplitFiles.length === 0) {
                alert('没有可下载的分割文件');
                return;
            }
            
            // 逐个下载分割文件
            let downloadedCount = 0;
            const totalCount = lastSplitFiles.length;
            
            // 创建下载状态显示
            const statusElement = document.getElementById('split-status');
            const originalStatus = statusElement.textContent;
            
            // 开始逐个下载
            const downloadNextFile = (index) => {
                if (index >= lastSplitFiles.length) {
                    statusElement.textContent = `已重新下载所有 ${totalCount} 个分割文件`;
                    return;
                }
                
                const fileInfo = lastSplitFiles[index];
                statusElement.textContent = `正在重新下载第 ${index + 1}/${totalCount} 个分割文件...`;
                
                // 下载当前文件
                saveAs(fileInfo.blob, fileInfo.fileName);
                
                // 延迟一下，避免浏览器限制
                setTimeout(() => {
                    downloadNextFile(index + 1);
                }, 300);
            };
            
            // 开始下载第一个文件
            downloadNextFile(0);
        }

        // 取消分割
        function cancelSplit() {
            if (splitWorker) {
                isSplitCancelled = true;
                document.getElementById('split-status').textContent = '正在取消分割...';
                splitWorker.postMessage({ isCancelled: true });
            }
        }

        // 开始合并文件
        function startMerge() {
            if (validSplitFiles.length === 0) {
                alert('没有可合并的有效文件');
                return;
            }
            
            const outputName = document.getElementById('merge-output-name').value || originalFileName || 'merged';
            
            // 更新UI状态
            document.getElementById('start-merge-btn').disabled = true;
            document.getElementById('cancel-merge-btn').disabled = false;
            document.getElementById('merge-status').textContent = '正在合并文件...';
            document.getElementById('merge-time').textContent = '';
            document.getElementById('merge-progress-bar').style.width = '0%';
            document.getElementById('merge-progress-text').textContent = '0%';
            document.getElementById('merge-download-container').innerHTML = '';
            
            isMergeCancelled = false;
            
            // 记录开始时间
            const startTime = new Date().getTime();
            
            // 处理文件合并
            processMergeFiles(validSplitFiles, outputName, startTime);
        }

        // 处理文件合并
        async function processMergeFiles(files, outputName, startTime) {
            try {
                // 第一步：读取所有文件的元数据（再次验证）
                const chunks = {};
                let totalChunks = 0;
                let originalName = '';
                
                for (let i = 0; i < files.length; i++) {
                    if (isMergeCancelled) {
                        throw new Error('合并已取消');
                    }
                    
                    const file = files[i];
                    const chunkData = await readFileChunkMetadata(file);
                    
                    if (i === 0) {
                        totalChunks = chunkData.totalChunks;
                        originalName = chunkData.originalName;
                    }
                    
                    chunks[chunkData.chunkIndex] = { file, dataOffset: chunkData.dataOffset };
                    
                    // 更新进度
                    const progress = Math.round(((i + 1) / files.length) * 30); // 30% 用于读取元数据
                    updateMergeProgress(progress);
                }
                
                // 第二步：合并所有数据块
                const mergedData = [];
                for (let i = 0; i < totalChunks; i++) {
                    if (isMergeCancelled) {
                        throw new Error('合并已取消');
                    }
                    
                    const chunk = chunks[i];
                    const fileData = await readFileData(chunk.file, chunk.dataOffset);
                    mergedData.push(fileData);
                    
                    // 更新进度 (30% - 100%)
                    const progress = 30 + Math.round(((i + 1) / totalChunks) * 70);
                    updateMergeProgress(progress);
                }
                
                if (isMergeCancelled) {
                    throw new Error('合并已取消');
                }
                
                // 完成合并，保存文件
                const blob = new Blob(mergedData, { type: 'application/zip' });
                const finalName = outputName.endsWith('.zip') ? outputName : `${outputName}.zip`;
                
                // 保存合并后的文件信息
                lastMergedFile = {
                    blob: blob,
                    fileName: finalName
                };
                
                // 自动下载合并后的文件
                saveAs(blob, finalName);
                
                // 完成处理
                const endTime = new Date().getTime();
                const elapsedTime = (endTime - startTime) / 1000;
                
                updateMergeProgress(100);
                document.getElementById('merge-status').textContent = `文件合并完成: ${finalName}`;
                document.getElementById('merge-time').textContent = formatTime(elapsedTime);
                
                // 显示重新下载按钮
                const downloadContainer = document.getElementById('merge-download-container');
                downloadContainer.innerHTML = `
                    <button onclick="downloadMergedFile()" class="btn-primary">
                        <i class="fa fa-download mr-2"></i>重新下载合并文件
                    </button>
                `;
                
            } catch (error) {
                document.getElementById('merge-status').textContent = error.message;
            } finally {
                // 重置按钮状态
                document.getElementById('start-merge-btn').disabled = false;
                document.getElementById('cancel-merge-btn').disabled = true;
                mergeWorker = null;
            }
        }

        // 下载合并后的文件
        function downloadMergedFile() {
            if (!lastMergedFile) {
                alert('没有可下载的合并文件');
                return;
            }
            
            // 下载文件
            saveAs(lastMergedFile.blob, lastMergedFile.fileName);
            
            // 更新状态
            const statusElement = document.getElementById('merge-status');
            const originalStatus = statusElement.textContent;
            statusElement.textContent = '正在重新下载合并文件...';
            
            // 稍后恢复状态
            setTimeout(() => {
                statusElement.textContent = originalStatus;
            }, 2000);
        }

        // 读取文件块的元数据（增加容错）
        function readFileChunkMetadata(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const buffer = e.target.result;
                        // 修复：检查buffer长度是否足够
                        if (buffer.byteLength < 4) {
                            reject(new Error('文件太小，不是有效的分割文件'));
                            return;
                        }
                        
                        const metaLength = new Uint32Array(buffer, 0, 1)[0];
                        // 检查元数据长度是否合法
                        if (metaLength <= 0 || metaLength + 4 > buffer.byteLength) {
                            reject(new Error('无效的元数据长度'));
                            return;
                        }
                        
                        const metaBytes = new Uint8Array(buffer, 4, metaLength);
                        const meta = JSON.parse(new TextDecoder().decode(metaBytes));
                        
                        // 验证元数据完整性
                        if (!meta.originalName || !meta.totalChunks || meta.chunkIndex === undefined) {
                            reject(new Error('元数据不完整'));
                            return;
                        }
                        
                        resolve({
                            ...meta,
                            dataOffset: 4 + metaLength // 元数据长度 + 元数据本身的偏移量
                        });
                    } catch (error) {
                        reject(new Error(`文件 ${file.name} 不是有效的分割文件: ${error.message}`));
                    }
                };
                reader.onerror = () => reject(new Error(`无法读取文件 ${file.name}`));
                // 修复：读取足够的字节（前10MB），避免元数据过长
                reader.readAsArrayBuffer(file.slice(0, 10 * 1024 * 1024));
            });
        }

        // 读取文件数据（跳过元数据）
        function readFileData(file, offset) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => reject(new Error(`无法读取文件 ${file.name}`));
                reader.readAsArrayBuffer(file.slice(offset));
            });
        }

        // 更新合并进度
        function updateMergeProgress(value) {
            document.getElementById('merge-progress-bar').style.width = `${value}%`;
            document.getElementById('merge-progress-text').textContent = `${value}%`;
        }

        // 取消合并
        function cancelMerge() {
            isMergeCancelled = true;
            document.getElementById('merge-status').textContent = '正在取消合并...';
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化时间
        function formatTime(seconds) {
            if (seconds < 60) {
                return `耗时: ${seconds.toFixed(2)} 秒`;
            } else {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                return `耗时: ${minutes} 分 ${remainingSeconds.toFixed(2)} 秒`;
            }
        }
    </script>
