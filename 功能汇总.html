<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://raw.githubusercontent.com/Jrafina/picbed/main/favicon.ico" type="image/x-icon">
    <title>功能导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 0 0 20px 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .page-count {
            opacity: 0.9;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        /* 搜索框样式 */
        .search-container {
            margin: 25px auto 10px;
            max-width: 600px;
            position: relative;
        }
        
        .search-box {
            width: 100%;
            padding: 15px 20px;
            padding-left: 50px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .search-box:focus {
            outline: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a11cb;
            font-size: 1.2rem;
        }
        
        .clear-search {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
        }
        
        .clear-search:hover {
            color: #6a11cb;
        }
        
        .search-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
            background: white;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .no-results i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ddd;
        }
        
        .pages-list {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .page-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }
        
        .page-item:last-child {
            border-bottom: none;
        }
        
        .page-item:hover {
            background-color: #f8f9ff;
            padding-left: 25px;
        }
        
        .page-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .page-icon i {
            font-size: 1.2rem;
        }
        
        .page-icon img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }
        
        .page-content {
            flex: 1;
        }
        
        .page-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .page-description {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        
        .page-arrow {
            color: #bbb;
            font-size: 1.2rem;
        }
        
        .category {
            margin-top: 40px;
            margin-bottom: 15px;
        }
        
        .category h2 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .search-results-info {
            margin-bottom: 15px;
            color: #6a11cb;
            font-weight: 500;
            display: none;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            header {
                padding: 30px 15px;
                margin-bottom: 20px;
            }
            
            .page-item {
                padding: 15px;
            }
            
            .search-box {
                padding: 12px 15px;
                padding-left: 45px;
            }
            
            .search-icon {
                left: 15px;
            }
            
            .clear-search {
                right: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>功能页面导航</h1>
            
            <div class="search-container">
                <div class="search-icon">
                    <i class="fas fa-search"></i>
                </div>
                <input type="text" id="searchInput" class="search-box" placeholder="搜索功能页面...">
                <button id="clearSearch" class="clear-search" title="清除搜索">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <p class="search-hint">搜索标题或描述中的关键词</p>
            <p class="page-count">共 <span id="pageCount">0</span> 个功能页面</p>
        </div>
    </header>
    
    <div class="container">        
        <div class="category" style="margin-top: 40px;">
            <h2>工具功能</h2>
            <div class="search-results-info" id="searchResultsInfo">
                搜索结果: <span id="resultsCount">0</span> 个匹配项
            </div>
        </div>
        
        <div class="no-results" id="noResults">
            <i class="fas fa-search"></i>
            <h3>未找到匹配项</h3>
            <p>尝试使用其他关键词搜索</p>
        </div>
        
        <div class="pages-list" id="pagesList">
            <!-- 页面列表将在这里动态生成 -->
        </div>
    </div>

    <script>
        // 页面数据 - 支持字体图标和图片URL
        const pages = [
            {
                title: "图片无损压缩",
                description: "免费批量图片压缩工具",
                icon: "https://small.im/favicon.svg",
                url: "https://small.im/zh-hans"
            },
            {
                title: "flux-ai.io",
                description: "让模糊图片瞬间变高清，细节更生动逼真",
                icon: "https://flux-ai.io/icon.svg?bdb16d22e5a90000",
                url: "https://flux-ai.io/cn/flux-ai-image-upscaler/"
            },
            {
                title: "文件分割与合并",
                description: "把大文件分割成小文件",
                icon: "fas fa-folder",
                url: "./功能html/文件分割与合并.html"
            }
        ];

        // 获取DOM元素
        const pagesListElement = document.getElementById('pagesList');
        const pageCountElement = document.getElementById('pageCount');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const noResultsElement = document.getElementById('noResults');
        const searchResultsInfo = document.getElementById('searchResultsInfo');
        const resultsCountElement = document.getElementById('resultsCount');

        // 当前过滤后的页面
        let filteredPages = [...pages];

        // 判断icon是否为URL（简单检查是否以http开头或以常见图片扩展名结尾）
        function isImageURL(icon) {
            return icon.startsWith('http') || 
                   icon.startsWith('data:image') || 
                   /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(icon);
        }

        // 搜索功能
        function searchPages(query) {
            if (!query.trim()) {
                // 如果查询为空，显示所有页面
                filteredPages = [...pages];
                searchResultsInfo.style.display = 'none';
            } else {
                // 转换为小写进行不区分大小写的搜索
                const lowerCaseQuery = query.toLowerCase();
                
                // 过滤页面：搜索标题和描述
                filteredPages = pages.filter(page => {
                    const titleMatch = page.title.toLowerCase().includes(lowerCaseQuery);
                    const descMatch = page.description.toLowerCase().includes(lowerCaseQuery);
                    return titleMatch || descMatch;
                });
                
                // 显示搜索结果信息
                searchResultsInfo.style.display = 'block';
                resultsCountElement.textContent = filteredPages.length;
            }
            
            // 渲染过滤后的页面
            renderPages();
            
            // 显示/隐藏无结果提示
            if (filteredPages.length === 0) {
                noResultsElement.style.display = 'block';
            } else {
                noResultsElement.style.display = 'none';
            }
            
            // 显示/隐藏清除按钮
            clearSearchBtn.style.display = query.trim() ? 'block' : 'none';
        }

        // 清除搜索
        function clearSearch() {
            searchInput.value = '';
            searchPages('');
            searchInput.focus();
        }

        // 渲染页面列表
        function renderPages() {
            // 更新页面计数
            pageCountElement.textContent = filteredPages.length;
            
            // 生成页面列表HTML
            const pagesHTML = filteredPages.map(page => createPageItem(page)).join('');
            pagesListElement.innerHTML = pagesHTML;
        }

        // 创建页面列表项
        function createPageItem(page) {
            let iconHTML;
            
            if (isImageURL(page.icon)) {
                // 如果是图片URL，使用img标签
                iconHTML = `<img src="${page.icon}" alt="${page.title}图标">`;
            } else {
                // 如果是字体图标类名，使用i标签
                iconHTML = `<i class="${page.icon}"></i>`;
            }
            
            return `
                <a href="${page.url}" target="_blank" class="page-item">
                    <div class="page-icon">
                        ${iconHTML}
                    </div>
                    <div class="page-content">
                        <div class="page-title">${page.title}</div>
                        <div class="page-description">${page.description}</div>
                    </div>
                    <div class="page-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </a>
            `;
        }

        // 事件监听器
        searchInput.addEventListener('input', function() {
            searchPages(this.value);
        });

        clearSearchBtn.addEventListener('click', clearSearch);

        // 初始渲染
        renderPages();
        
        // 添加访问统计（可选）
        document.addEventListener('click', function(event) {
            if (event.target.closest('.page-item')) {
                const pageItem = event.target.closest('.page-item');
                const pageTitle = pageItem.querySelector('.page-title').textContent;
                console.log(`访问页面: ${pageTitle}`);
                // 这里可以添加实际的访问统计代码
            }
        });
    </script>
</body>
</html>
