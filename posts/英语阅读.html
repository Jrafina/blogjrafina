<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习图片 · 时间线</title>
    <style>
        :root {
            --bg: #f9f8f6;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #5e5e5e;
            --text-light: #8a8a8a;
            --border: #e2dfd8;
            --primary: #4a6d7c;
            --primary-light: #6b8f9e;
            --accent: #c97d60;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-lg: 16px;
            --font-serif: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
            --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(74,109,124,0.03) 0%, transparent 60%);
        }

        /* ========== 头部 ========== */
        .header {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .logo-icon {
            font-size: 1.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
            white-space: nowrap;
            text-decoration: none;
            user-select: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(74,109,124,0.25);
        }
        .btn-primary:hover {
            background: #3f5f6e;
            box-shadow: 0 4px 16px rgba(74,109,124,0.35);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            border-color: #c0bbb0;
            background: #fafaf8;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.78rem;
        }

        /* ========== 主容器 ========== */
        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }

        /* ========== 时间线 ========== */
        .timeline {
            position: relative;
            padding-left: 48px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e0dcd2;
            border-radius: 1px;
        }

        .timeline-group {
            position: relative;
            margin-bottom: 36px;
        }
        .timeline-dot {
            position: absolute;
            left: -34px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid #f0ede8;
            box-shadow: 0 0 0 3px rgba(74,109,124,0.15);
            z-index: 2;
        }
        .date-heading {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }
        .date-heading small {
            font-weight: 400;
            color: var(--text-light);
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .image-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            width: 180px;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
            border-color: #cec9bf;
        }
        .image-card .card-img-wrap {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f3ef;
            margin-bottom: 8px;
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .image-card:hover img {
            transform: scale(1.04);
        }
        .image-card .card-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin: 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .image-card .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-top: 4px;
        }
        .image-card .delete-btn {
            background: none;
            border: none;
            color: #b0a89e;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 4px;
            transition: var(--transition);
            font-weight: 600;
        }
        .image-card .delete-btn:hover {
            color: #c0392b;
            background: #fef5f5;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .empty-state p {
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30,28,20,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-lg);
            padding: 28px 24px 20px;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h3 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #4a4a4a;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: var(--font-sans);
            transition: var(--transition);
            background: #fafaf8;
            color: var(--text);
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(107,143,158,0.12);
            background: #fff;
        }
        .form-group textarea {
            min-height: 70px;
        }
        .url-preview {
            max-width: 100%;
            max-height: 140px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: var(--shadow-sm);
            display: none;
        }
        .url-preview.show {
            display: block;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ========== 灯箱 ========== */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20,18,15,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            background: #fff;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: fadeScale 0.25s ease;
        }
        @keyframes fadeScale {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .lightbox-img {
            display: block;
            max-width: 85vw;
            max-height: 75vh;
            object-fit: contain;
            background: #1a1a1a;
        }
        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: var(--transition);
        }
        .lightbox-close:hover {
            background: rgba(0,0,0,0.7);
        }
        .lightbox-note {
            padding: 16px 20px;
            background: #fff;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-top: 1px solid #eee;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #3d3d3d;
            color: #fff;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 500;
            letter-spacing: 0.02em;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .timeline {
                padding-left: 36px;
            }
            .timeline::before {
                left: 15px;
            }
            .timeline-dot {
                left: -28px;
                width: 10px;
                height: 10px;
                border-width: 2px;
            }
            .image-row {
                gap: 8px;
            }
            .image-card {
                width: 140px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 头部 ==================== -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">📖</span> 英语学习时间线
            </div>
            <button class="btn btn-primary" id="btnAdd">＋ 添加图片</button>
        </div>
    </header>

    <!-- ==================== 主内容 ==================== -->
    <main class="main-container">
        <div class="timeline" id="timelineContainer">
            <!-- JS动态渲染 -->
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📷</div>
            <p>时间线空空如也</p>
            <button class="btn btn-primary" id="emptyAddBtn">＋ 添加第一张学习图片</button>
        </div>
    </main>

    <!-- ==================== 添加/编辑模态框 ==================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">📷 添加学习图片</h3>
            <div class="form-group">
                <label>📅 日期</label>
                <input type="date" id="inputDate" />
            </div>
            <div class="form-group">
                <label>🔗 图片URL</label>
                <input type="url" id="inputImageUrl" placeholder="https://example.com/english.jpg" />
                <img class="url-preview" id="urlPreview" src="" alt="预览" />
            </div>
            <div class="form-group">
                <label>💬 学习笔记（可选）</label>
                <textarea id="inputNote" placeholder="今天学了什么？" maxlength="200"></textarea>
            </div>
            <input type="hidden" id="inputEditId" value="" />
            <div class="modal-buttons">
                <button class="btn btn-outline" id="btnModalCancel">取消</button>
                <button class="btn btn-primary" id="btnModalSave">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- ==================== 图片灯箱 ==================== -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">✕</button>
            <img class="lightbox-img" id="lightboxImg" src="" alt="学习图片" />
            <div class="lightbox-note" id="lightboxNote"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== 数据管理 ====================
            const STORAGE_KEY = 'english_timeline_images';
            let images = [];

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    images = raw ? JSON.parse(raw) : [];
                    // 确保数据格式
                    images = images.map(item => ({
                        id: item.id || 'img_' + Date.now() + Math.random(),
                        date: item.date || getTodayStr(),
                        url: item.url || '',
                        note: item.note || '',
                    }));
                    // 按日期降序排列
                    images.sort((a, b) => b.date.localeCompare(a.date));
                } catch (e) {
                    images = [];
                }
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
            }

            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function addOrUpdateImage(data) {
                if (data.id) {
                    const idx = images.findIndex(item => item.id === data.id);
                    if (idx >= 0) images[idx] = { ...images[idx], ...data };
                } else {
                    images.push({
                        id: 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        date: data.date,
                        url: data.url,
                        note: data.note,
                    });
                }
                images.sort((a, b) => b.date.localeCompare(a.date));
                saveData();
            }

            function deleteImage(id) {
                images = images.filter(item => item.id !== id);
                saveData();
            }

            // ==================== 渲染时间线 ====================
            function groupByDate() {
                const groups = {};
                images.forEach(item => {
                    if (!groups[item.date]) groups[item.date] = [];
                    groups[item.date].push(item);
                });
                // 返回按日期降序的数组
                return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => ({
                    date,
                    items: groups[date],
                }));
            }

            function renderTimeline() {
                const container = document.getElementById('timelineContainer');
                const emptyState = document.getElementById('emptyState');
                const groups = groupByDate();

                if (groups.length === 0) {
                    container.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';

                const formatDate = (dateStr) => {
                    const parts = dateStr.split('-');
                    const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                    return `${parseInt(parts[1])}月${parseInt(parts[2])}日 · 星期${weekdays[d.getDay()]}`;
                };

                let html = '';
                groups.forEach(group => {
                    html += `
                        <div class="timeline-group">
                            <div class="timeline-dot"></div>
                            <div class="date-heading">
                                ${formatDate(group.date)}
                                <small>${group.date}</small>
                            </div>
                            <div class="image-row">
                                ${group.items.map(item => `
                                    <div class="image-card" data-id="${item.id}">
                                        <div class="card-img-wrap">
                                            <img src="${escapeHtml(item.url)}" alt="学习图片" loading="lazy"
                                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22120%22><rect fill=%22%23f5f3ef%22 width=%22160%22 height=%22120%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2232%22 fill=%22%23ccc%22>🖼️</text></svg>'">
                                        </div>
                                        ${item.note ? `<p class="card-note">${escapeHtml(item.note)}</p>` : ''}
                                        <div class="card-actions">
                                            <button class="delete-btn" data-action="delete" data-id="${item.id}">🗑 删除</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                // 绑定点击查看大图
                container.querySelectorAll('.image-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('[data-action="delete"]')) return;
                        const id = this.getAttribute('data-id');
                        const item = images.find(i => i.id === id);
                        if (item) openLightbox(item);
                    });
                });

                // 绑定删除按钮
                container.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');
                        if (confirm('确定要删除这张学习图片吗？')) {
                            deleteImage(id);
                            renderTimeline();
                            showToast('已删除');
                        }
                    });
                });
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ==================== 模态框逻辑 ====================
            const modalOverlay = document.getElementById('modalOverlay');
            const inputDate = document.getElementById('inputDate');
            const inputImageUrl = document.getElementById('inputImageUrl');
            const inputNote = document.getElementById('inputNote');
            const inputEditId = document.getElementById('inputEditId');
            const urlPreview = document.getElementById('urlPreview');
            const modalTitle = document.getElementById('modalTitle');

            function openAddModal() {
                modalTitle.textContent = '📷 添加学习图片';
                inputDate.value = getTodayStr();
                inputImageUrl.value = '';
                inputNote.value = '';
                inputEditId.value = '';
                urlPreview.classList.remove('show');
                urlPreview.src = '';
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function openEditModal(item) {
                modalTitle.textContent = '✏️ 编辑学习图片';
                inputDate.value = item.date;
                inputImageUrl.value = item.url;
                inputNote.value = item.note;
                inputEditId.value = item.id;
                if (item.url) {
                    urlPreview.src = item.url;
                    urlPreview.classList.add('show');
                } else {
                    urlPreview.classList.remove('show');
                }
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
                inputImageUrl.value = '';
                urlPreview.classList.remove('show');
                urlPreview.src = '';
                inputEditId.value = '';
            }

            function handleSave() {
                const date = inputDate.value;
                const url = inputImageUrl.value.trim();
                const note = inputNote.value.trim();
                const editId = inputEditId.value;

                if (!date) {
                    showToast('请选择日期');
                    return;
                }
                if (!url) {
                    showToast('请输入图片URL');
                    return;
                }
                // 简单URL验证
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('data:')) {
                    showToast('URL必须以http://或https://开头');
                    return;
                }

                addOrUpdateImage({
                    id: editId || undefined,
                    date,
                    url,
                    note,
                });

                closeModal();
                renderTimeline();
                showToast(editId ? '已更新' : '已添加');
            }

            // URL实时预览
            inputImageUrl.addEventListener('input', function() {
                const val = this.value.trim();
                if (val && (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:'))) {
                    urlPreview.src = val;
                    urlPreview.classList.add('show');
                } else {
                    urlPreview.classList.remove('show');
                }
            });

            // ==================== 灯箱 ====================
            const lightboxOverlay = document.getElementById('lightboxOverlay');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxNote = document.getElementById('lightboxNote');

            function openLightbox(item) {
                lightboxImg.src = item.url;
                lightboxNote.textContent = item.note || '（无笔记）';
                lightboxOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightboxOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // ==================== Toast ====================
            let toastTimer;
            function showToast(msg) {
                const toast = document.getElementById('toast');
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // ==================== 事件绑定 ====================
            document.getElementById('btnAdd').addEventListener('click', openAddModal);
            document.getElementById('emptyAddBtn').addEventListener('click', openAddModal);
            document.getElementById('btnModalCancel').addEventListener('click', closeModal);
            document.getElementById('btnModalSave').addEventListener('click', handleSave);
            document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
            lightboxOverlay.addEventListener('click', function(e) {
                if (e.target === lightboxOverlay) closeLightbox();
            });
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (lightboxOverlay.classList.contains('active')) closeLightbox();
                    if (modalOverlay.classList.contains('active')) closeModal();
                }
            });

            // ==================== 初始化示例数据 ====================
            function initDemoIfEmpty() {
                if (images.length > 0) return;
                const today = new Date();
                const demos = [
                    { daysAgo: 0, url: 'https://picsum.photos/seed/english_timeline1/600/400', note: '今天背诵了50个新单词，感觉效率很高！' },
                    { daysAgo: 1, url: 'https://picsum.photos/seed/english_timeline2/600/400', note: '复习了虚拟语气，画了思维导图。' },
                    { daysAgo: 2, url: 'https://picsum.photos/seed/english_timeline3/600/400', note: '阅读了一篇科技文章，学习了AI术语。' },
                    { daysAgo: 4, url: 'https://picsum.photos/seed/english_timeline4/600/400', note: '' },
                ];
                demos.forEach(d => {
                    const d2 = new Date(today);
                    d2.setDate(d2.getDate() - d.daysAgo);
                    const dateStr = d2.getFullYear() + '-' +
                        String(d2.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d2.getDate()).padStart(2, '0');
                    images.push({
                        id: 'demo_' + Date.now() + '_' + Math.random().toString(36),
                        date: dateStr,
                        url: d.url,
                        note: d.note,
                    });
                });
                images.sort((a, b) => b.date.localeCompare(a.date));
                saveData();
            }

            // ==================== 启动 ====================
            function init() {
                loadData();
                initDemoIfEmpty();
                loadData(); // 重新加载确保排序
                renderTimeline();
            }

            init();
            console.log('✨ 英语学习时间线已就绪');
        })();
    </script>
</body>
</html>
