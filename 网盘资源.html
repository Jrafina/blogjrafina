<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘资源 - Jrafina的博客小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 文章页面特定样式 */
        .article-main-container {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }
        
        /* 文章导航侧边栏 */
        .article-sidebar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            height: fit-content;
            position: sticky;
            top: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .article-sidebar h3 {
            font-size: 1.4em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .article-toc {
            list-style: none;
        }
        
        .article-toc li {
            margin-bottom: 12px;
        }
        
        .article-toc a {
            color: #94a3b8;
            text-decoration: none;
            display: block;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.9em;
            cursor: none;
        }
        
        .article-toc a:hover {
            color: #f1f5f9;
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(5px);
        }
        
        .article-toc .toc-h2 {
            margin-left: 15px;
            font-size: 0.85em;
        }
        
        /* 文章内容区域 */
        .article-content-wrapper {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-height: 800px;
        }
        
        .article-header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .article-title {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        
        .article-meta {
            color: #94a3b8;
            font-size: 0.9em;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .article-tag {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        /* 文章内容样式 - 保持原有结构，仅调整颜色和间距 */
        .article-body {
            line-height: 1.8;
            color: #e2e8f0;
        }
        
        /* 标题样式 */
        .article-body h1,
        .article-body h2,
        .article-body h3,
        .article-body h4,
        .article-body h5,
        .article-body h6 {
            color: #f1f5f9;
            margin-top: 2em;
            margin-bottom: 1em;
            font-weight: 600;
        }
        
        .article-body h1 {
            font-size: 2.2em;
            border-bottom: 2px solid rgba(99, 102, 241, 0.3);
            padding-bottom: 10px;
            margin-top: 1.5em;
        }
        
        .article-body h2 {
            font-size: 1.8em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        
        .article-body h3 {
            font-size: 1.5em;
        }
        
        /* 段落样式 */
        .article-body p {
            margin: 1.2em 0;
            color: #e2e8f0;
        }
        
        /* 链接样式 */
        .article-body a {
            color: #06b6d4;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .article-body a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }
        
        /* 引用块样式 */
        .article-body blockquote {
            border-left: 4px solid #6366f1;
            padding: 15px 20px;
            margin: 20px 0;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 0 8px 8px 0;
            color: #cbd5e1;
        }
        
        /* 表格样式 */
        .article-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .article-body table th {
            background: rgba(99, 102, 241, 0.2);
            color: #f1f5f9;
            font-weight: 600;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid rgba(99, 102, 241, 0.3);
        }
        
        .article-body table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }
        
        .article-body table tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        
        /* 图片样式 */
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 25px 0;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* 水平线样式 */
        .article-body hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            margin: 40px 0;
        }
        
        /* 列表样式 */
        .article-body ul,
        .article-body ol {
            margin: 20px 0;
            padding-left: 30px;
            color: #e2e8f0;
        }
        
        .article-body li {
            margin: 10px 0;
        }
        
        /* 代码块样式 - 完全保留原始结构 */
        .md-fences {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin: 25px 0;
            position: relative;
        }
        
        /* 行内代码样式 */
        .article-body code:not(.md-fences code) {
            background: rgba(99, 102, 241, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #f1f5f9;
            font-size: 0.9em;
        }
        
        /* 文章操作按钮 */
        .article-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .article-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: none;
        }
        
        .article-btn:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            border-color: transparent;
        }
        
        /* 返回按钮 */
        .back-to-home {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: none;
        }
        
        .back-btn:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: transparent;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .article-main-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 20px;
            }
            
            .article-sidebar {
                position: static;
                order: 2;
            }
            
            .article-content-wrapper {
                order: 1;
            }
        }
        
        @media (max-width: 768px) {
            .article-content-wrapper {
                padding: 30px 20px;
            }
            
            .article-title {
                font-size: 2em;
            }
            
            .back-to-home {
                top: 20px;
                left: 20px;
            }
            
            .back-btn span {
                display: none;
            }
            
            .back-btn {
                padding: 12px;
                border-radius: 50%;
            }
            
            .article-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .article-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
