<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">文章 - Jrafina的博客</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- KaTeX for math formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Blog styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" href="https://img-proxy.ppig.eu.cc/drawingbed/2026/04/头像.ico" type="image/x-icon">

    <!-- Posts manifest -->
    <script src="posts/posts.js"></script>
    <!-- Marked.js for Markdown rendering (v5 stable, global `marked`) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@5.1.2/marked.min.js"></script>
    <!-- KaTeX for math -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- KaTeX auto-render extension -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>

<!-- Layout -->
<div class="page-wrap">

    <!-- ============ LEFT: Post Content ============ -->
    <main class="main-panel glass-strong">

        <!-- Back link -->
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> 返回文章列表
        </a>

        <!-- Post Meta -->
        <div class="post-meta-bar" id="postMeta" style="display:none;">
            <span class="post-tag" id="postTag"></span>
            <span class="post-date" id="postDate"></span>
        </div>

        <!-- Title -->
        <h1 class="site-title" id="postTitle" style="text-align:left; font-size:2em; margin-bottom:4px;"></h1>
        <span class="site-title-decor" style="margin:0 0 28px 0;"></span>

        <!-- Rendered Content -->
        <article class="post-content" id="postContent">
            <p style="text-align:center;color:var(--text-tertiary);padding:40px 0;">
                <i class="fa-solid fa-spinner fa-spin"></i> 加载中...
            </p>
        </article>

        <!-- Comments -->
        <section class="comments-section glass-card" style="margin-top:48px;">
            <div class="comments-title">💬 评论</div>
            <div id="waline"></div>
        </section>
    </main>

    <!-- ============ RIGHT: TOC Sidebar ============ -->
    <aside class="side-panel glass">
        <div class="side-section">
            <div class="side-title"><i class="fa-solid fa-list-ul"></i> 文章目录</div>
            <nav id="tocNav">
                <p class="toc-empty" id="tocEmpty">正在生成目录...</p>
            </nav>
        </div>

        <!-- Other posts quick nav -->
        <div class="side-section">
            <div class="side-title"><i class="fa-solid fa-link"></i> 其他文章</div>
            <ul class="quick-nav" id="otherPostsNav">
                <!-- Filled by JS -->
            </ul>
        </div>
    </aside>
</div>

<script>
(function() {
    // --- Parse query param ---
    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('post');

    if (!postFile) {
        document.getElementById('postContent').innerHTML =
            '<p style="text-align:center;padding:60px 0;color:var(--text-tertiary);">未指定文章。请从<a href="index.html">文章列表</a>选择一篇文章。</p>';
        document.getElementById('tocEmpty').textContent = '无内容';
        buildOtherPosts();
        return;
    }

    // --- Find post metadata ---
    const postMeta = POSTS.find(p => p.file === postFile);

    // --- Render other posts list ---
    function buildOtherPosts() {
        const nav = document.getElementById('otherPostsNav');
        nav.innerHTML = POSTS
            .filter(p => p.file !== postFile)
            .map(p => `<li><a href="post.html?post=${encodeURIComponent(p.file)}">${p.title}</a></li>`)
            .join('');
    }

    // --- Determine if it's an HTML or MD file ---
    const isHTML = postFile.endsWith('.html');

    // Set title
    document.title = (postMeta ? postMeta.title : postFile) + ' - Jrafina的博客';
    document.getElementById('pageTitle').textContent = document.title;

    // Show post meta
    if (postMeta) {
        const meta = document.getElementById('postMeta');
        meta.style.display = 'flex';
        document.getElementById('postTag').textContent =
            postMeta.category === 'tutorials' ? '教程归纳' : '学习合集';
        document.getElementById('postTag').className = 'post-tag ' + postMeta.category;
        document.getElementById('postDate').textContent = postMeta.date;
    }

    document.getElementById('postTitle').textContent = postMeta ? postMeta.title : postFile;

    buildOtherPosts();

    if (isHTML) {
        loadHTMLPost(postFile);
    } else {
        loadMDPost(postFile);
    }

    // ============== HTML Post Loader ==============
    function loadHTMLPost(file) {
        fetch('posts/' + file)
            .then(res => res.text())
            .then(html => {
                const div = document.getElementById('postContent');
                // Extract just the body content
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const body = doc.body;

                // Remove scripts for safety
                body.querySelectorAll('script').forEach(s => s.remove());

                // Check if it's a Typora export
                const writeDiv = body.querySelector('#write') || body.querySelector('.markdown-body');

                if (writeDiv) {
                    div.innerHTML = writeDiv.innerHTML;
                } else {
                    div.innerHTML = body.innerHTML;
                }

                // Render any KaTeX that Typora might have left as raw text
                renderMathInElement(div);

                // Generate TOC from headings
                setTimeout(() => generateTOC(div), 200);
            })
            .catch(err => {
                document.getElementById('postContent').innerHTML =
                    `<p style="text-align:center;padding:60px;color:var(--text-tertiary);">
                        文章加载失败：${err.message}<br>
                        <a href="index.html">返回首页</a>
                    </p>`;
            });
    }

    // ============== Markdown Post Loader ==============
    function loadMDPost(file) {
        fetch('posts/' + file)
            .then(res => {
                if (!res.ok) throw new Error('文章文件不存在: ' + file);
                return res.text();
            })
            .then(md => {
                const div = document.getElementById('postContent');
                const codeBlocks = [];
                const mathBlocks = [];
                let c = 0, m = 0;

                // --- Step 1: Protect fenced code blocks FIRST ---
                md = md.replace(/(```[\s\S]*?```)/g, (match) => {
                    codeBlocks.push(match);
                    return `\n@@CODEBLOCK${c++}@@\n`;
                });

                // --- Step 2: Protect $$ display math ---
                md = md.replace(/\$\$([\s\S]*?)\$\$/g, (_m, content) => {
                    mathBlocks.push({ type: 'display', content: '$$' + content + '$$' });
                    return `\n@@MATH${m++}@@\n`;
                });

                // --- Step 3: Protect $ inline math ---
                md = md.replace(/\$([^$\n]+?)\$/g, (_m, content) => {
                    if (/^\d/.test(content.trim())) return _m;
                    mathBlocks.push({ type: 'inline', content: '$' + content + '$' });
                    return `@@MATH${m++}@@`;
                });

                // --- Step 4: Restore code blocks ---
                md = md.replace(/@@CODEBLOCK(\d+)@@/g,
                    (_m, i) => codeBlocks[parseInt(i)]);

                // --- Step 5: Parse with Marked ---
                marked.setOptions({ breaks: false, gfm: true });
                let html = marked.parse(md);

                // --- Step 6: Restore math ---
                html = html.replace(/<p[^>]*>@@MATH(\d+)@@<\/p>/g,
                    (_m, i) => mathBlocks[parseInt(i)].content);
                html = html.replace(/@@MATH(\d+)@@/g,
                    (_m, i) => mathBlocks[parseInt(i)].content);

                div.innerHTML = html;

                // Render KaTeX
                renderMathInElement(div);

                // Generate TOC from headings
                setTimeout(() => generateTOC(div), 200);
            })
            .catch(err => {
                document.getElementById('postContent').innerHTML =
                    `<p style="text-align:center;padding:60px;color:var(--text-tertiary);">
                        文章加载失败：${err.message}<br>
                        <a href="index.html">返回首页</a>
                    </p>`;
            });
    }

    // ============== KaTeX Render ==============
    function renderMathInElement(el) {
        try {
            renderMathInElement(el, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$',  right: '$',  display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false,
                strict: false,
                trust: true
            });
        } catch(e) {
            console.warn('KaTeX render error (non-fatal):', e.message);
        }
    }

    // ============== TOC Generator ==============
    function generateTOC(container) {
        const headings = container.querySelectorAll('h1, h2, h3, h4');
        const tocNav = document.getElementById('tocNav');
        const tocEmpty = document.getElementById('tocEmpty');

        if (headings.length === 0) {
            tocEmpty.textContent = '本文无标题';
            return;
        }

        tocEmpty.style.display = 'none';

        const ul = document.createElement('ul');
        ul.className = 'toc-list';

        // Assign IDs to headings that don't have one
        headings.forEach((h, i) => {
            if (!h.id) {
                h.id = 'heading-' + (i + 1);
            }
        });

        headings.forEach(h => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.className = 'toc-' + h.tagName.toLowerCase();

            // Scroll spy: highlight current TOC entry
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.getElementById(h.id);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

                // Update active state
                tocNav.querySelectorAll('a').forEach(link => link.classList.remove('active'));
                a.classList.add('active');
            });

            li.appendChild(a);
            ul.appendChild(li);
        });

        tocNav.appendChild(ul);

        // Scroll spy with IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    tocNav.querySelectorAll('a').forEach(a => {
                        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
                    });
                }
            });
        }, { rootMargin: '-60px 0px -70% 0px' });

        headings.forEach(h => observer.observe(h));
    }
})();
</script>

<!-- ============ Waline Comments ============ -->
<script type="module">
    import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
    init({
        el: '#waline',
        serverURL: 'https://comment2.1795857.xyz',
        dark: false,
        meta: ['nick', 'mail', 'link'],
        requiredMeta: ['nick'],
        lang: 'zh-CN',
        placeholder: '欢迎留言...',
        emoji: [],
    });
</script>

</body>
</html>
