                    <div class="categories-header">
                        <ul class="category-list header-categories">
                            <li class="category-item">
                                <span class="category-link active" data-category="all">全部文章</span>
                            </li>
                            <li class="category-item">
                                <span class="category-link" data-category="tutorials">教程归纳</span>
                            </li>
                            <li class="category-item">

                </li>
            </ul>

            <!-- 评论区移到主内容区内 -->
            <div id="waline"></div>
        </main>
    </div>

                </button>
                <button class="control-btn" id="prev-btn" title="上一首">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn" id="next-btn" title="下一首">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <!-- 音乐播放器核心元素 -->
