<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客文章菜单</title>
    <style>
        body {
            font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            gap: 40px;
            background-color: #f0f7ff;  /* 浅蓝色 */
}

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        h1 {
            color: #333;
            font-size: 2.2em;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
        }

        /* 搜索框样式 */
        .search-container {
            margin-bottom: 30px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #4183C4;
            box-shadow: 0 0 0 2px rgba(65, 131, 196, 0.2);
        }

        /* 文章列表样式 */
        .article-list {
            list-style: none;
            padding: 0;
        }

        .article-item {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
            background-color: #f0f7ff;  /* 浅蓝色 */
        }

        .article-item:hover {
            transform: translateY(-3px);
            background-color: #f8f9fa;  /* 浅灰色 */
        }

        .article-link {
            text-decoration: none;
            color: #4183C4;
            font-size: 1.2em;
            font-weight: 600;
            z-index: 999;
            position: relative;
        }

        .article-link:hover {
            text-decoration: underline;
        }

        .article-meta {
            color: #888;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .article-desc {
            color: #666;
            margin-top: 8px;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
        }

        .author-info {
            text-align: center;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 圆形头像样式 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 3px solid #f0f0f0;
        }

        .author-name {
            font-size: 1.5em;
            color: #333;
            margin: 0 0 15px;
        }

        /* 邮箱样式 - 修复上浮问题 */
        .email-container {
            position: relative;
            display: inline-block;
            margin-top: 15px;
            /* 增加点击区域 */
            padding: 5px;
            cursor: pointer;
        }

        .email-icon {
            font-size: 1.5em;
            color: #4183C4;
            /* 确保图标是块级元素，有足够的点击区域 */
            display: inline-block;
            /* 明确过渡属性，确保动画生效 */
            transition: transform 0.3s ease-in-out;
            /* 初始位置 */
            transform: translateY(0);
        }

        /* 修复hover触发 - 直接作用于container时触发图标动画 */
        .email-container:hover .email-icon {
            transform: translateY(-5px);
        }

        .email-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 5px 10px;
            margin-bottom: 8px;
            white-space: nowrap;
            z-index: 100;
            /* 增加透明度过渡，更平滑 */
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .email-container:hover .email-tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* 邮箱图标样式 */
        .email-icon::before {
            content: "✉";
            /* 增加图标大小和内边距，提升交互体验 */
            display: inline-block;
            padding: 5px;
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="author-info">
            <!-- 1. 修改头像为本地文件路径 -->
            <img src="头像.jpg" alt="作者头像" class="avatar">
            <h2 class="author-name">Jrafina</h2>
            <div class="email-container">
                <span class="email-icon"></span>
                <span class="email-tooltip">1795857787@qq.com</span>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <header>
            <h1>Jrafina的博客小站</h1>
            <p>欢迎访问我的博客文章列表</p>
        </header>

        <!-- 搜索框 -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜索文章标题..." id="searchInput">
        </div>

        <!-- 文章列表 -->
        <ul class="article-list" id="articleList">
            <li class="article-item">
                <a href="博客搭建及托管.html" class="article-link" target="_blank">文章1：博客搭建及托管</a>
                <div class="article-meta">上传时间：2025-11-28</div>
                <p class="article-desc">这是关于博客搭建及托管的详细指南，包含相关配置和操作步骤。</p>
            </li>

        </ul>
    </main>

    <script>
        // 搜索功能实现
        const searchInput = document.getElementById('searchInput');
        const articleList = document.getElementById('articleList');
        const articles = articleList.getElementsByTagName('li');

        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            
            // 遍历所有文章项进行筛选
            for (let i = 0; i < articles.length; i++) {
                const articleTitle = articles[i].querySelector('.article-link').textContent.toLowerCase();
                
                // 如果标题包含搜索词则显示，否则隐藏
                if (articleTitle.includes(searchTerm)) {
                    articles[i].style.display = '';
                } else {
                    articles[i].style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
